services:
  dcelup-app:
    build: .
    restart: unless-stopped
    depends_on:
      dcelup-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-3011}:3000"
    env_file: .env
    environment:
      TZ: Asia/Jakarta
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
  dcelup-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dcelup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}
      POSTGRES_DB: dcelup_chicken
    volumes:
      - dcelup_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcelup -d dcelup_chicken"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  dcelup_pgdata:
